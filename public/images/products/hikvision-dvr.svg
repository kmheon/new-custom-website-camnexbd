<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bgDvr" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FAF7F2"/>
      <stop offset="100%" stop-color="#F4EEE6"/>
    </linearGradient>
    <linearGradient id="chassisGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
  </defs>
  <rect width="400" height="400" rx="24" fill="url(#bgDvr)"/>
  
  <!-- DVR 3D Perspective Chassis -->
  <polygon points="60,180 320,180 345,150 85,150" fill="#1E293B" stroke="#475569" stroke-width="2"/>
  <rect x="60" y="180" width="260" height="75" rx="6" fill="url(#chassisGrad)" stroke="#334155" stroke-width="2"/>
  <polygon points="320,180 345,150 345,225 320,255" fill="#0F172A" stroke="#334155" stroke-width="2"/>
  
  <!-- Front Panel Recessed Strip -->
  <rect x="75" y="195" width="230" height="45" rx="4" fill="#020617"/>
  
  <!-- Ventilation Grille Slots -->
  <line x1="85" y1="205" x2="150" y2="205" stroke="#334155" stroke-width="3" stroke-linecap="round"/>
  <line x1="85" y1="215" x2="150" y2="215" stroke="#334155" stroke-width="3" stroke-linecap="round"/>
  <line x1="85" y1="225" x2="150" y2="225" stroke="#334155" stroke-width="3" stroke-linecap="round"/>
  
  <!-- USB Port -->
  <rect x="175" y="210" width="16" height="10" rx="2" fill="#0F172A" stroke="#475569" stroke-width="1.5"/>
  
  <!-- Status LEDs (Power, HDD, TX/RX) -->
  <circle cx="240" cy="215" r="4" fill="#22C55E"/>
  <circle cx="260" cy="215" r="4" fill="#F15A24"/>
  <circle cx="280" cy="215" r="4" fill="#3B82F6"/>
  
  <!-- Logo Accent -->
  <rect x="85" y="165" width="30" height="5" rx="2" fill="#F15A24"/>
  <rect x="122" y="165" width="40" height="5" rx="2" fill="#64748B"/>
</svg>
