<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bgWifi" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FAF7F2"/>
      <stop offset="100%" stop-color="#F4EEE6"/>
    </linearGradient>
    <radialGradient id="apBody" cx="45%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="80%" stop-color="#F1F5F9"/>
      <stop offset="100%" stop-color="#CBD5E1"/>
    </radialGradient>
  </defs>
  <rect width="400" height="400" rx="24" fill="url(#bgWifi)"/>
  
  <!-- Subtle RF Signal Waves -->
  <circle cx="200" cy="200" r="150" fill="none" stroke="#F15A24" stroke-width="1.5" stroke-dasharray="6 6" opacity="0.25"/>
  <circle cx="200" cy="200" r="170" fill="none" stroke="#F15A24" stroke-width="1" stroke-dasharray="4 8" opacity="0.15"/>
  
  <!-- Outer Drop Ring -->
  <circle cx="200" cy="204" r="115" fill="#94A3B8" opacity="0.2"/>
  
  <!-- AP Main Enclosure (Circular Ceiling Mount) -->
  <circle cx="200" cy="200" r="115" fill="url(#apBody)" stroke="#E2E8F0" stroke-width="2"/>
  <circle cx="200" cy="200" r="102" fill="none" stroke="#F8FAFC" stroke-width="3"/>
  
  <!-- Center Circular Recess -->
  <circle cx="200" cy="200" r="48" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  
  <!-- Status Ring Indicator (Ruijie LED Ring) -->
  <circle cx="200" cy="200" r="32" fill="none" stroke="#0284C7" stroke-width="4" stroke-dasharray="45 10"/>
  
  <!-- Center Logo Dot -->
  <circle cx="200" cy="200" r="6" fill="#F15A24"/>
  
  <!-- Wi-Fi 6 Symbol Icon in Center -->
  <path d="M 188 185 Q 200 176 212 185" fill="none" stroke="#64748B" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M 192 191 Q 200 184 208 191" fill="none" stroke="#64748B" stroke-width="2.5" stroke-linecap="round"/>
</svg>

