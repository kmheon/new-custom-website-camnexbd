<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bgLock" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FAF7F2"/>
      <stop offset="100%" stop-color="#F4EEE6"/>
    </linearGradient>
    <linearGradient id="escutcheon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="50%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="handleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#64748B"/>
      <stop offset="50%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>
  </defs>
  <rect width="400" height="400" rx="24" fill="url(#bgLock)"/>

  <!-- Wi-Fi / Security Signal Arcs -->
  <circle cx="200" cy="80" r="40" fill="none" stroke="#F15A24" stroke-width="2" stroke-dasharray="4 6" opacity="0.35"/>
  <circle cx="200" cy="80" r="55" fill="none" stroke="#F15A24" stroke-width="1.5" stroke-dasharray="6 8" opacity="0.2"/>

  <!-- Main Smart Lock Escutcheon Plate (Sleek High-Security Front Body) -->
  <rect x="145" y="75" width="110" height="255" rx="28" fill="url(#escutcheon)" stroke="#475569" stroke-width="3"/>
  <rect x="151" y="81" width="98" height="243" rx="22" fill="none" stroke="#64748B" stroke-width="1" opacity="0.5"/>

  <!-- Biometric Scanner Recess at Top of Handle Pivot -->
  <circle cx="200" cy="115" r="18" fill="#020617" stroke="#475569" stroke-width="2"/>
  <circle cx="200" cy="115" r="14" fill="#0369A1" opacity="0.75"/>
  <!-- Fingerprint Ridges -->
  <path d="M 194 115 Q 200 108 206 115 M 196 119 Q 200 113 204 119" stroke="#38BDF8" stroke-width="1.5" fill="none" opacity="0.9"/>

  <!-- Touch Keypad Grid (Digital Touchpad) -->
  <g fill="#FFFFFF" opacity="0.85" font-family="sans-serif" font-size="9" font-weight="bold" text-anchor="middle">
    <!-- Row 1 -->
    <circle cx="172" cy="155" r="6" fill="#1E293B"/>
    <text x="172" y="158">1</text>
    <circle cx="200" cy="155" r="6" fill="#1E293B"/>
    <text x="200" y="158">2</text>
    <circle cx="228" cy="155" r="6" fill="#1E293B"/>
    <text x="228" y="158">3</text>
    <!-- Row 2 -->
    <circle cx="172" cy="172" r="6" fill="#1E293B"/>
    <text x="172" y="175">4</text>
    <circle cx="200" cy="172" r="6" fill="#1E293B"/>
    <text x="200" y="175">5</text>
    <circle cx="228" cy="172" r="6" fill="#1E293B"/>
    <text x="228" y="175">6</text>
    <!-- Row 3 -->
    <circle cx="172" cy="189" r="6" fill="#1E293B"/>
    <text x="172" y="192">7</text>
    <circle cx="200" cy="189" r="6" fill="#1E293B"/>
    <text x="200" y="192">8</text>
    <circle cx="228" cy="189" r="6" fill="#1E293B"/>
    <text x="228" y="192">9</text>
    <!-- Row 4 -->
    <circle cx="172" cy="206" r="6" fill="#1E293B"/>
    <text x="172" y="209">*</text>
    <circle cx="200" cy="206" r="6" fill="#1E293B"/>
    <text x="200" y="209">0</text>
    <circle cx="228" cy="206" r="6" fill="#1E293B"/>
    <text x="228" y="209">#</text>
  </g>

  <!-- Door Lever Handle (Horizontal Bar) -->
  <rect x="100" y="235" width="125" height="24" rx="10" fill="url(#handleGrad)" stroke="#475569" stroke-width="2"/>
  <circle cx="200" cy="247" r="18" fill="url(#escutcheon)" stroke="#475569" stroke-width="2"/>
  <circle cx="200" cy="247" r="8" fill="#F15A24"/>

  <!-- Mechanical Key Hole / Emergency USB Port at Base -->
  <rect x="195" y="295" width="10" height="18" rx="4" fill="#020617" stroke="#475569" stroke-width="1.5"/>
  <line x1="200" y1="298" x2="200" y2="307" stroke="#94A3B8" stroke-width="1.5"/>
</svg>

