<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bgPlug" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FAF7F2"/>
      <stop offset="100%" stop-color="#F4EEE6"/>
    </linearGradient>
    <radialGradient id="plugFace" cx="45%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="70%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#E2E8F0"/>
    </radialGradient>
    <linearGradient id="plugBezel" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E2E8F0"/>
      <stop offset="100%" stop-color="#CBD5E1"/>
    </linearGradient>
  </defs>
  <rect width="400" height="400" rx="24" fill="url(#bgPlug)"/>

  <!-- Energy Pulse Wave Circles -->
  <circle cx="200" cy="200" r="145" fill="none" stroke="#0284C7" stroke-width="1.5" stroke-dasharray="6 6" opacity="0.3"/>
  <circle cx="200" cy="200" r="165" fill="none" stroke="#F15A24" stroke-width="1.5" stroke-dasharray="4 8" opacity="0.2"/>

  <!-- Outer Drop Bezel -->
  <rect x="110" y="110" width="180" height="180" rx="42" fill="url(#plugBezel)" stroke="#CBD5E1" stroke-width="3"/>

  <!-- Main Smart Plug Face -->
  <rect x="118" y="118" width="164" height="164" rx="36" fill="url(#plugFace)" stroke="#F1F5F9" stroke-width="2"/>

  <!-- Grounding & Socket Receptacle Wells (Universal / Multi-Pin Socket) -->
  <!-- Top Ground Hole -->
  <rect x="194" y="150" width="12" height="20" rx="5" fill="#334155" stroke="#1E293B" stroke-width="1.5"/>

  <!-- Left & Right Power Sockets -->
  <rect x="156" y="185" width="12" height="26" rx="5" fill="#334155" stroke="#1E293B" stroke-width="1.5"/>
  <rect x="232" y="185" width="12" height="26" rx="5" fill="#334155" stroke="#1E293B" stroke-width="1.5"/>

  <!-- Center Circular Protective Shutter -->
  <circle cx="200" cy="200" r="26" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <path d="M 194 195 Q 200 188 206 195 M 190 200 Q 200 184 210 200" fill="none" stroke="#64748B" stroke-width="2" stroke-linecap="round"/>

  <!-- Manual On/Off Power Toggle Button with LED Indicator Ring -->
  <circle cx="200" cy="245" r="14" fill="#020617"/>
  <circle cx="200" cy="245" r="12" fill="none" stroke="#22C55E" stroke-width="2.5"/>
  <!-- Power Icon Symbol -->
  <path d="M 197 241 A 5 5 0 1 0 203 241 M 200 238 L 200 244" fill="none" stroke="#22C55E" stroke-width="1.5" stroke-linecap="round"/>
</svg>

