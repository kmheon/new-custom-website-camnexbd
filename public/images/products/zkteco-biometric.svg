<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bgBio" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FAF7F2"/>
      <stop offset="100%" stop-color="#F4EEE6"/>
    </linearGradient>
    <linearGradient id="terminalBody" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="screenGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0284C7"/>
      <stop offset="100%" stop-color="#0369A1"/>
    </linearGradient>
    <linearGradient id="sensorGlow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#22C55E"/>
      <stop offset="100%" stop-color="#15803D"/>
    </linearGradient>
  </defs>
  <rect width="400" height="400" rx="24" fill="url(#bgBio)"/>
  
  <!-- Terminal Outer Body -->
  <rect x="110" y="80" width="180" height="240" rx="20" fill="url(#terminalBody)" stroke="#334155" stroke-width="4"/>
  
  <!-- Top Camera / Face Recognition Bar -->
  <rect x="135" y="96" width="130" height="24" rx="12" fill="#020617"/>
  <circle cx="160" cy="108" r="6" fill="#0284C7"/>
  <circle cx="160" cy="108" r="2.5" fill="#FFFFFF"/>
  <circle cx="240" cy="108" r="4" fill="#EF4444" opacity="0.8"/>
  
  <!-- TFT Color Display -->
  <rect x="130" y="130" width="140" height="95" rx="8" fill="url(#screenGrad)" stroke="#0F172A" stroke-width="2"/>
  
  <!-- Screen UI Mockup: Clock & Avatar -->
  <circle cx="160" cy="165" r="14" fill="#FFFFFF" opacity="0.3"/>
  <rect x="185" y="155" width="60" height="8" rx="4" fill="#FFFFFF" opacity="0.9"/>
  <rect x="185" y="170" width="40" height="6" rx="3" fill="#FFFFFF" opacity="0.6"/>
  <rect x="150" y="195" width="100" height="16" rx="4" fill="#22C55E" opacity="0.9"/>
  
  <!-- Optical Fingerprint Sensor Prism -->
  <rect x="160" y="240" width="80" height="55" rx="10" fill="#020617" stroke="#475569" stroke-width="2"/>
  <ellipse cx="200" cy="267" rx="26" ry="18" fill="url(#sensorGlow)" opacity="0.7"/>
  <!-- Fingerprint Ridges Vector -->
  <path d="M 188 267 Q 200 255 212 267 M 192 272 Q 200 263 208 272 M 196 277 Q 200 271 204 277" stroke="#FFFFFF" stroke-width="1.8" fill="none" opacity="0.8"/>
  
  <!-- Subtle Brand Accent Bar -->
  <rect x="180" y="306" width="40" height="4" rx="2" fill="#F15A24"/>
</svg>

